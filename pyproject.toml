[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A standalone module for generating and solving mazes."
readme = { file = "mazegen/README.md", content-type = "text/markdown" }
requires-python = ">=3.6"
authors = [
    { name = "Zuzanna Gorecka" },
    { name = "Katarzyna Kulagowska" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[tool.setuptools]
packages = ["mazegen"]
